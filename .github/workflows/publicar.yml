name: publicar-instagram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicar.py
      - name: Guardar estado
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add publicado.json
          git diff --cached --quiet || (git commit -m "publicado" && git push)
